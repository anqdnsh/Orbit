name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ORBIT_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Optional: a fixed signing key so each new APK installs over the last one.
      # Add repo secrets ORBIT_KEYSTORE_B64, ORBIT_KEYSTORE_PASSWORD, ORBIT_KEY_ALIAS, ORBIT_KEY_PASSWORD.
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/orbit.jks"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: app/build/outputs/apk/release/*.apk
